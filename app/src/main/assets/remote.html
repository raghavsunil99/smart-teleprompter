<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompter Remote</title>
<style>
  :root {
    --bg: #0e0e10; --panel: #1a1a1e; --line: #2a2a30; --text: #f2f2f2; --muted: #8b8b93;
    --accent: #ffc94d; --accent-ink: #1a1400; --red: #b3261e; --ok: #3ccf6e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: var(--ok); }
  .dot.hear { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #conn { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 1.2fr 1fr; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  #title { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  #line { font-size: 26px; line-height: 1.35; min-height: 72px; padding: 10px 12px; border-left: 4px solid var(--red); background: rgba(179,38,30,.15); border-radius: 6px; }
  #next { font-size: 18px; color: var(--muted); margin-top: 10px; min-height: 26px; }
  #heard { font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin-top: 14px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .controls { display: grid; gap: 12px; margin-top: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; color: var(--text); background: #26262c; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-width: 44px; }
  button:hover { background: #303038; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #play { background: var(--accent); color: var(--accent-ink); border: none; font-size: 18px; font-weight: 600; padding: 14px 28px; border-radius: 12px; }
  .seg { display: inline-flex; background: #26262c; border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
  .seg button { border: none; border-radius: 999px; background: transparent; padding: 8px 16px; }
  .seg button.on { background: #0a84ff; color: #fff; }
  .label { color: var(--muted); font-size: 13px; min-width: 70px; }
  kbd { font: 12px ui-monospace, monospace; background: #26262c; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
  .keys { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: #111114; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  textarea { min-height: 260px; resize: vertical; font-size: 17px; line-height: 1.5; }
  .stack { display: grid; gap: 10px; }
  #msg { font-size: 13px; color: var(--muted); min-height: 18px; }
  #pinView { max-width: 360px; margin: 12vh auto; text-align: center; padding: 28px; }
  #pinView input { font-size: 32px; letter-spacing: .4em; text-align: center; margin: 16px 0; }
  .hidden { display: none !important; }
  .mic { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #141417; display: grid; gap: 8px; }
  #micBtn.live { background: var(--red); border-color: var(--red); color: #fff; }
  #micHeard { font-size: 15px; min-height: 22px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #micMsg { font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>

<section id="pinView" class="hidden">
  <h1 style="margin:0 0 6px;font-size:22px">Prompter Remote</h1>
  <div id="pinHint" style="color:var(--muted)">Connecting to your phone…</div>
  <input id="pin" class="hidden" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN">
  <button id="pinGo" class="on" style="width:100%">Connect</button>
  <div id="pinMsg" style="color:#ff8a80;margin-top:10px;min-height:20px"></div>
</section>

<div id="app" class="hidden">
  <header>
    <span id="dot" class="dot"></span>
    <h1>Prompter Remote</h1>
    <span id="conn">connecting…</span>
  </header>
  <main>
    <section>
      <h2>Now on the phone</h2>
      <div id="title"></div>
      <div id="line"></div>
      <div id="next"></div>
      <div class="progress"><div id="bar"></div></div>
      <div id="heard"></div>

      <div class="mic">
        <div class="row">
          <button id="micBtn">🎙 Listen on laptop</button>
          <span id="micState" class="label">Phone is using its own mic</span>
        </div>
        <div id="micHeard"></div>
        <div id="micMsg"></div>
      </div>

      <div class="controls">
        <div class="row">
          <button id="play">▶ Play</button>
          <span class="seg">
            <button id="modeSteady">Steady</button>
            <button id="modeVoice">Voice Follow</button>
          </span>
        </div>
        <div class="row">
          <span class="label">Position</span>
          <button data-cmd="up" title="Back one line">↑ Line</button>
          <button data-cmd="down" title="Forward one line">↓ Line</button>
          <button data-cmd="top" title="Back to start">⤒ Start</button>
        </div>
        <div class="row" id="sectionRow" style="display:none">
          <span class="label">Sections</span>
          <button data-cmd="prevSection" title="Previous section (P)">⏮</button>
          <span id="sections" class="row" style="gap:6px"></span>
          <button data-cmd="nextSection" title="Next section (N)">⏭</button>
        </div>
        <div class="row">
          <span class="label">Text</span>
          <button data-cmd="smaller">A−</button>
          <button data-cmd="bigger">A+</button>
          <span id="font" class="label"></span>
        </div>
        <div class="row">
          <span class="label">Speed</span>
          <button data-cmd="slower">−</button>
          <button data-cmd="faster">+</button>
          <span id="speed" class="label">(Steady mode)</span>
        </div>
        <div class="row">
          <span class="label">Display</span>
          <button id="flip" data-cmd="flip">⇅ Upside-down</button>
          <button id="mirror" data-cmd="mirror">⇆ Mirror</button>
        </div>
      </div>
      <div class="keys">
        <span><kbd>Space</kbd> play / pause</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> line</span>
        <span><kbd>+</kbd><kbd>−</kbd> text size</span>
        <span><kbd>[</kbd><kbd>]</kbd> speed</span>
        <span><kbd>M</kbd> mode</span>
        <span><kbd>T</kbd> start</span>
        <span><kbd>L</kbd> laptop mic</span>
        <span><kbd>N</kbd><kbd>P</kbd> next / previous section</span>
      </div>
    </section>

    <section class="stack">
      <h2>Scripts</h2>
      <select id="scriptList"><option value="">— New script —</option></select>
      <input id="sTitle" placeholder="Title">
      <textarea id="sBody" placeholder="Paste or type your script here (Tenglish or Telugu)…"></textarea>
      <div class="row">
        <button id="send" class="on">Send to phone &amp; open</button>
        <span id="msg"></span>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let pin = null;
  try { pin = localStorage.getItem('prompterPin'); } catch (e) {}
  let status = {};
  let failures = 0;
  let needPin = false; // only when the phone has "Require PIN" switched on

  async function api(path, form) {
    const opts = { headers: { 'X-Pin': pin || '' } };
    if (form) {
      opts.method = 'POST';
      opts.headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
      opts.body = new URLSearchParams(form).toString();
    }
    const r = await fetch(path, opts);
    if (r.status === 401 || r.status === 403) {
      const wasAsked = needPin;
      needPin = true;
      showPin(r.status === 403 ? 'Too many wrong PINs — wait a minute and try again.'
        : wasAsked ? 'Wrong PIN. Check the PIN in the phone\'s Remote screen.'
        : 'This phone has “Require PIN” on. Enter the PIN from the phone\'s Remote screen.');
      throw new Error('auth');
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  const cmd = (c, value) => api('/api/cmd', value == null ? { cmd: c } : { cmd: c, value }).then(poll).catch(() => {});

  function showPin(message) {
    $('app').classList.add('hidden');
    $('pinView').classList.remove('hidden');
    $('pinMsg').textContent = message || '';
    $('pinHint').textContent = needPin ? 'Enter the PIN shown in the app’s Remote screen' : '';
    $('pin').classList.toggle('hidden', !needPin);
    $('pin').value = '';
    if (needPin) $('pin').focus();
  }

  async function connect() {
    try {
      await api('/api/status');
      try {
        if (needPin) localStorage.setItem('prompterPin', pin);
      } catch (e) {}
      $('pinView').classList.add('hidden');
      $('app').classList.remove('hidden');
      loadScripts();
      poll();
    } catch (e) {
      if (e.message !== 'auth') {
        showPin('Cannot reach the phone. Check that Remote is still on and the laptop is on the same Wi-Fi.');
      }
    }
  }

  $('pinGo').onclick = () => {
    if (needPin) pin = $('pin').value.trim();
    connect();
  };
  $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pinGo').click(); });

  function render(s) {
    const onPrompter = s.screen === 'prompter';
    $('dot').className = 'dot' + (s.hearing ? ' hear' : s.running ? ' on' : '');
    $('title').textContent = onPrompter ? (s.title || '') : 'Phone is on the script list — send or pick a script to open it.';
    $('line').textContent = onPrompter ? (s.line || '') : '';
    $('next').textContent = onPrompter ? (s.next || '') : '';
    $('bar').style.width = Math.round((s.progress || 0) * 100) + '%';
    $('heard').textContent = s.heard ? '🎙 ' + s.heard : '';
    $('play').textContent = s.countdown > 0 ? 'Starting in ' + s.countdown + '…'
      : s.running ? '❚❚ Pause' : '▶ Play';
    renderSections(onPrompter ? (s.sections || []) : [], s.section);
    $('modeSteady').classList.toggle('on', s.mode === 'steady');
    $('modeVoice').classList.toggle('on', s.mode !== 'steady');
    $('font').textContent = s.fontSize ? Math.round(s.fontSize) + ' pt' : '';
    $('speed').textContent = s.speed ? Math.round(s.speed) + (s.mode === 'steady' ? '' : '  (used in Steady mode)') : '';
    $('flip').classList.toggle('on', !!s.flip);
    $('mirror').classList.toggle('on', !!s.mirror);
    if (!window.isSecureContext) explainSecureContext();
    $('micState').textContent = s.laptopMic ? 'Phone is following the laptop mic' : 'Phone is using its own mic';
  }

  let sectionKey = '';
  function renderSections(list, current) {
    $('sectionRow').style.display = list.length ? '' : 'none';
    const key = JSON.stringify(list);
    if (key !== sectionKey) {
      sectionKey = key;
      const box = $('sections');
      box.innerHTML = '';
      list.forEach((title, i) => {
        const b = document.createElement('button');
        b.textContent = title;
        b.onclick = () => cmd('section', String(i));
        box.appendChild(b);
      });
    }
    [...$('sections').children].forEach((b, i) => b.classList.toggle('on', i === current));
  }

  async function poll() {
    try {
      status = await api('/api/status');
      failures = 0;
      $('conn').textContent = 'connected';
      render(status);
    } catch (e) {
      if (e.message === 'auth') return;
      failures++;
      $('conn').textContent = failures > 2 ? 'phone not reachable — is Remote still on?' : 'reconnecting…';
      $('dot').className = 'dot';
    }
  }
  setInterval(() => { if (!$('app').classList.contains('hidden')) poll(); }, 500);

  async function loadScripts() {
    try {
      const list = await api('/api/scripts');
      const sel = $('scriptList');
      const keep = sel.value;
      sel.innerHTML = '<option value="">— New script —</option>';
      for (const s of list) {
        const o = document.createElement('option');
        o.value = s.id; o.textContent = s.title || '(untitled)';
        sel.appendChild(o);
      }
      sel.value = keep;
    } catch (e) {}
  }

  $('scriptList').onchange = async () => {
    const id = $('scriptList').value;
    if (!id) { $('sTitle').value = ''; $('sBody').value = ''; return; }
    try {
      const s = await api('/api/script?id=' + encodeURIComponent(id));
      $('sTitle').value = s.title; $('sBody').value = s.body;
    } catch (e) {}
  };

  $('send').onclick = async () => {
    const body = $('sBody').value;
    if (!body.trim()) { $('msg').textContent = 'Script is empty.'; return; }
    $('msg').textContent = 'Sending…';
    try {
      const r = await api('/api/script', { id: $('scriptList').value, title: $('sTitle').value, body });
      await loadScripts();
      $('scriptList').value = r.id;
      $('msg').textContent = 'Opened on the phone ✓';
    } catch (e) { $('msg').textContent = 'Could not send.'; }
  };

  // ---- Laptop microphone: recognise Telugu here and send the words to the phone ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, finals = '', pending = null, lastSent = '', sendTimer = null, beatTimer = null;
  const lastWords = (t, n) => t.trim().split(/\s+/).filter(Boolean).slice(-n).join(' ');
  const micMsg = (html) => { $('micMsg').innerHTML = html || ''; };

  function explainSecureContext() {
    if (window.isSecureContext) {
      micMsg('Chrome blocked the microphone. Click the icon at the left of the address bar, allow <b>Microphone</b>, then click Listen again.');
      return;
    }
    // Plain http page: point at the phone's https address, where Chrome allows the mic.
    const u = status.httpsPort ? 'https://' + location.hostname + ':' + status.httpsPort + '/' : '';
    micMsg('Chrome only allows the laptop mic on the secure address. ' +
      (u ? 'Open <a href="' + u + '">' + u + '</a>' : 'Open the https address shown in the phone’s Remote screen') +
      '. The first time, Chrome warns “Your connection is not private”: click <b>Advanced → Proceed</b>.');
  }

  function sendHeard(text) {
    return api('/api/heard', { text }).catch(() => {});
  }

  function queue(text) {
    pending = text;
    if (!sendTimer) sendTimer = setTimeout(() => {
      sendTimer = null;
      if (pending !== null && pending !== lastSent) { lastSent = pending; sendHeard(pending); }
      pending = null;
    }, 80);
  }

  function startMic() {
    if (!SR) { micMsg('This browser has no speech recognition. Please use Google Chrome.'); return; }
    if (!window.isSecureContext) { explainSecureContext(); return; }
    listening = true; finals = ''; lastSent = '';
    rec = new SR();
    rec.lang = 'te-IN';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finals = lastWords(finals + ' ' + r[0].transcript, 12);
        else interim += ' ' + r[0].transcript;
      }
      const text = lastWords(finals + ' ' + interim, 12);
      $('micHeard').textContent = '💻 ' + text;
      queue(text);
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopMic(); explainSecureContext(); }
      else if (e.error === 'language-not-supported') { stopMic(); micMsg('Chrome cannot recognise Telugu (te-IN) here.'); }
      else if (e.error === 'network') micMsg('Speech service unreachable — the laptop needs internet. Retrying…');
    };
    // Chrome ends sessions after silences or about a minute; keep it going.
    rec.onend = () => { if (listening) setTimeout(() => { try { rec.start(); } catch (err) {} }, 150); };
    rec.onstart = () => micMsg('');
    try { rec.start(); } catch (err) {}
    beatTimer = setInterval(() => sendHeard(''), 1500); // tells the phone the laptop mic is live
    sendHeard('');
    cmd('mode', 'voice').then(() => { if (!status.running) cmd('play'); });
    $('micBtn').textContent = '■ Stop laptop mic';
    $('micBtn').classList.add('live');
  }

  function stopMic() {
    listening = false;
    clearInterval(beatTimer);
    try { rec && rec.stop(); } catch (err) {}
    $('micBtn').textContent = '🎙 Listen on laptop';
    $('micBtn').classList.remove('live');
    $('micHeard').textContent = '';
  }

  $('micBtn').onclick = () => (listening ? stopMic() : startMic());

  $('play').onclick = () => cmd(status.running || status.countdown > 0 ? 'pause' : 'play');
  $('modeSteady').onclick = () => cmd('mode', 'steady');
  $('modeVoice').onclick = () => cmd('mode', 'voice');
  document.querySelectorAll('[data-cmd]').forEach((b) => { b.onclick = () => cmd(b.dataset.cmd); });

  document.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const map = {
      ' ': () => cmd(status.running || status.countdown > 0 ? 'pause' : 'play'),
      n: () => cmd('nextSection'), p: () => cmd('prevSection'),
      ArrowUp: () => cmd('up'), ArrowDown: () => cmd('down'),
      '+': () => cmd('bigger'), '=': () => cmd('bigger'), '-': () => cmd('smaller'),
      '[': () => cmd('slower'), ']': () => cmd('faster'),
      m: () => cmd('mode', status.mode === 'steady' ? 'voice' : 'steady'),
      t: () => cmd('top'),
      l: () => $('micBtn').click(),
    };
    const f = map[e.key] || map[e.key.toLowerCase()];
    if (f) { e.preventDefault(); f(); }
  });

  connect();
})();
</script>
</body>
</html>
